; Psyight pixel node on an ESP32 DevKit (WROOM-32) over WiFi: the STM32 node's core
; (firmware/node-f767/src/core) on ESP-IDF, one WS2812 output on GPIO2 (D2).
; Build: pio run. Flash: pio run -t upload. Console: pio device monitor.

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
